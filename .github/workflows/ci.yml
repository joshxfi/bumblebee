name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Node 24 (.nvmrc) is the project baseline; Vite 8, @vitejs/plugin-react 6
      # and Vitest 5 need >= 22.12, and `bun run test` runs Vitest under Node.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Blocks on high/critical advisories. The ignore is braces (no patched
      # release yet), reached only through the shadcn CLI devDependency
      # (fast-glob -> micromatch); it never ships to the browser. Drop it once
      # braces publishes a fix.
      - name: Audit dependencies
        run: >-
          bun audit --audit-level=high
          --ignore=GHSA-vfj7-8cjw-p6xm

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
