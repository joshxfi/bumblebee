name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Blocks on high/critical advisories. The ignores are Node-only transitive
      # deps of @huggingface/transformers (onnxruntime-node -> adm-zip, sharp);
      # vite.config.ts aliases the package to its web build, so they never ship
      # to the browser. Drop each ignore once transformers bumps the dependency.
      - name: Audit dependencies
        run: >-
          bun audit --audit-level=high
          --ignore=GHSA-xcpc-8h2w-3j85
          --ignore=GHSA-7q85-xj36-vmfc
          --ignore=GHSA-rcw4-f5rp-g42v
          --ignore=GHSA-j5f4-cc29-5x44
          --ignore=GHSA-8238-w5pm-2374
          --ignore=GHSA-f88m-g3jw-g9cj
          --ignore=GHSA-rgj7-g3m4-5g8c

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
